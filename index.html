
<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">

<title>Completem les frases</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
    color: #111;
}

h1 {
    text-align: center;
    font-size: 30px;
    margin-bottom: 12px;
}

.instruccions {
    text-align: center;
    font-size: 19px;
    margin-bottom: 25px;
}

.contenidor {
    max-width: 1000px;
    margin: auto;
}

.exercici {
    background: white;
    border: 2px solid #333;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}

.numero {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 12px;
}

.frase {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    font-size: 25px;
    line-height: 2;
    margin-bottom: 15px;
}

.paraula-audio {
    display: inline;
    border-radius: 3px;
    padding: 2px 1px;
}

.paraula-audio.activa {
    background: #ffeb3b;
    text-decoration: underline;
    text-decoration-thickness: 3px;
    text-underline-offset: 4px;
}

.icona {
    font-size: 38px;
    margin: 0 4px;
    line-height: 1.3;
}

input {
    width: 190px;
    max-width: 45vw;
    font-size: 22px;
    padding: 8px;
    border: 2px solid #333;
    border-radius: 6px;
    text-align: center;
    text-transform: uppercase;
}

.botons {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

.boto-audio {
    background: #d9eaff;
}

.boto-corregir {
    background: #a8d5a2;
}

.boto-reiniciar {
    background: #f4c6a6;
}

.resultat {
    font-size: 18px;
    font-weight: bold;
    margin-top: 12px;
    min-height: 23px;
}

.correcte {
    color: green;
}

.incorrecte {
    color: #c00000;
}

@media (max-width: 600px) {
    body {
        padding: 10px;
    }

    .frase {
        font-size: 21px;
    }

    input {
        width: 145px;
        font-size: 19px;
    }

    button {
        font-size: 14px;
    }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<h1>COMPLETEM LES FRASES</h1>

<p class="instruccions">
MIRA LA IMATGE, ESCOLTA LA FRASE I ESCRIU LA PARAULA QUE FALTA.
</p>

<div class="contenidor" id="contenidor"></div>
    <div style="text-align:center; margin: 30px auto;">
    <button id="descarregarPDF" style="background:#d9eaff; font-size:18px; padding:15px 25px;">
        DESCARREGAR RESULTATS EN PDF
    </button>
</div>

<script>

// FRASES I PARAULES

    {

    },

    // ESCOLA
    {

    {

    },
    {

    },
    {

    {

    {

    // MÚSICA
    {

    },
    {

    },
    {

        inici: "TOCO EL",
        final: "AMB LES BAQUETES."
    },
    {
        paraula: "VIOLÍ",
        icona: "🎻",
        inici: "EL",
        final: "ÉS UN INSTRUMENT MUSICAL."
    }

const contenidor = document.getElementById("contenidor");
    // REGISTRE DELS RESULTATS DE LES FRASES.
const resultats = dades.map(dada => ({
    paraula: dada.paraula,
    resposta: "",
    estat: "PENDENT"
}));

function normalitzar(text) {
    return text
        .trim()
        .toUpperCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ");
}

// CREA LES PARAULES DE LA FRASE
function crearParaules(text, grup) {
    const elements = [];

    // Manté la puntuació enganxada a la paraula.
    const trossos = text.trim().split(/\s+/);

    trossos.forEach((tros, index) => {
        const span = document.createElement("span");
        span.className = "paraula-audio";
        span.textContent = tros;
        span.dataset.grup = grup;
        span.dataset.index = index;
        elements.push(span);
    });

    return elements;
}

// CREA LES ACTIVITATS
dades.forEach((dada, index) => {

    const exercici = document.createElement("div");
    exercici.className = "exercici";

    const numero = document.createElement("div");
    numero.className = "numero";
    numero.textContent = "FRASE " + (index + 1);

    const frase = document.createElement("div");
    frase.className = "frase";

    const elementsInici = crearParaules(dada.inici, "inici");
    const elementsFinal = crearParaules(dada.final, "final");

    elementsInici.forEach((element, i) => {
        frase.appendChild(element);
        if (i < elementsInici.length - 1) {
            frase.appendChild(document.createTextNode(" "));
        }
    });

    // ICONA I ESPAI PER ESCRIURE
    const icona = document.createElement("span");
    icona.className = "icona";
    icona.textContent = dada.icona;
    icona.setAttribute("aria-label", "Imatge de referència");

    const entrada = document.createElement("input");
    entrada.type = "text";
    entrada.placeholder = "........";
    entrada.autocomplete = "off";
    entrada.setAttribute("aria-label", "Escriu la paraula que falta");

    frase.appendChild(document.createTextNode(" "));
    frase.appendChild(icona);
    frase.appendChild(entrada);

    frase.appendChild(document.createTextNode(" "));

    elementsFinal.forEach((element, i) => {
        frase.appendChild(element);
        if (i < elementsFinal.length - 1) {
            frase.appendChild(document.createTextNode(" "));
        }
    });

    // BOTONS
    const botons = document.createElement("div");
    botons.className = "botons";

    const botoAudio = document.createElement("button");
    botoAudio.className = "boto-audio";
    botoAudio.textContent = "▶ PLAY";

    const botoCorregir = document.createElement("button");
    botoCorregir.className = "boto-corregir";
    botoCorregir.textContent = "CORREGIR";

    const botoReiniciar = document.createElement("button");
    botoReiniciar.className = "boto-reiniciar";
    botoReiniciar.textContent = "TORNAR A COMENÇAR";

    const resultat = document.createElement("div");
    resultat.className = "resultat";

    botons.appendChild(botoAudio);
    botons.appendChild(botoCorregir);
    botons.appendChild(botoReiniciar);

    exercici.appendChild(numero);
    exercici.appendChild(frase);
    exercici.appendChild(botons);
    exercici.appendChild(resultat);

    contenidor.appendChild(exercici);

    // TOTS ELS ELEMENTS QUE ES PODEN LLEGIR
    const paraulesVisibles = [
        ...elementsInici,
        ...elementsFinal
    ];

    let reproduccio = 0;

    function treureSubratllat() {
        paraulesVisibles.forEach(element => {
            element.classList.remove("activa");
        });
    }


    // LECTOR DE PARAULES EN CATALÀ
    botoAudio.addEventListener("click", () => {

        if (!("speechSynthesis" in window)) {
            resultat.textContent = "EL NAVEGADOR NO ADMET LECTURA D'ÀUDIO.";
            resultat.className = "resultat incorrecte";
            return;
        }

        // Atura qualsevol lectura anterior.
        window.speechSynthesis.cancel();

        reproduccio++;
        const identificador = reproduccio;

        treureSubratllat();

        let posicio = 0;

        // Seqüència de lectura amb una pausa al lloc de la paraula que falta.
        const seq = [
            ...elementsInici.map(element => ({ element: element })),
            { pausa: true },
            ...elementsFinal.map(element => ({ element: element }))
        ];

        function llegirSeguent() {

            if (identificador !== reproduccio) return;

            // Hem acabat de llegir.
            if (posicio >= seq.length) {
                treureSubratllat();
                return;
            }

            const item = seq[posicio];
            posicio++;

            // Fem una pausa al lloc de la paraula que falta.
            if (item.pausa) {
                treureSubratllat();

                setTimeout(() => {
                    if (identificador !== reproduccio) return;
                    llegirSeguent();
                }, 800);

                return;
            }

            const element = item.element;

            treureSubratllat();
            element.classList.add("activa");

            const veu = new SpeechSynthesisUtterance(
                element.textContent
            );

            veu.lang = "ca-ES";
            veu.rate = 0.85;
            veu.pitch = 1;

            const veus = window.speechSynthesis.getVoices();

            const veuCatala = veus.find(v =>
                v.lang.toLowerCase().startsWith("ca")
            );

            if (veuCatala) {
                veu.voice = veuCatala;
            }

            veu.onend = () => {
                if (identificador !== reproduccio) return;
                setTimeout(llegirSeguent, 120);
            };

            veu.onerror = () => {
                if (identificador !== reproduccio) return;
                setTimeout(llegirSeguent, 120);
            };

            window.speechSynthesis.speak(veu);
        }

        // INICIA LA LECTURA
        llegirSeguent();

    });


    // CORREGIR
botoCorregir.addEventListener("click", () => {

    const respostaAlumne = entrada.value.trim();

    // Guardem la resposta.
    resultats[index].resposta = respostaAlumne;

    if (normalitzar(respostaAlumne) === normalitzar(dada.paraula)) {

        resultat.textContent = "MOLT BÉ! RESPOSTA CORRECTA!";
        resultat.className = "resultat correcte";

        resultats[index].estat = "CORRECTE";

    } else {

        resultat.textContent = "TORNA-HO A PROVAR!";
        resultat.className = "resultat incorrecte";

        resultats[index].estat = "INCORRECTE";
    }
});


    // TORNAR A COMENÇAR
botoReiniciar.addEventListener("click", () => {

    entrada.value = "";
    resultat.textContent = "";
    resultat.className = "resultat";

    // Esborrem el resultat guardat.
    resultats[index].resposta = "";
    resultats[index].estat = "PENDENT";

    reproduccio++;
    window.speechSynthesis.cancel();
    treureSubratllat();
});

});

// CARREGA LES VEUS DISPONIBLES
if ("speechSynthesis" in window) {
    window.speechSynthesis.getVoices();
}

// DESCARREGAR ELS RESULTATS EN PDF.
document.getElementById("descarregarPDF").addEventListener("click", () => {

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    // CALCULEM ELS RESULTATS.
    const correctes = resultats.filter(r => r.estat === "CORRECTE").length;
    const incorrectes = resultats.filter(r => r.estat === "INCORRECTE").length;
    const pendents = resultats.filter(r => r.estat === "PENDENT").length;

    let y = 20;

    // TÍTOL.
    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("RESULTATS DE L'ACTIVITAT", 15, y);

    y += 12;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(12);
    doc.text("Activitat: Completem les frases", 15, y);

    y += 9;
    doc.text("Data: " + new Date().toLocaleDateString("ca-ES"), 15, y);

    y += 9;
    doc.text("Nom de l'alumne/a: __________________________", 15, y);

    y += 15;

    // RESUM DELS RESULTATS.
    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text("RESUM DELS RESULTATS", 15, y);

    y += 10;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);

    doc.text("Respostes correctes: " + correctes + " de " + dades.length, 15, y);
    y += 7;

    doc.text("Respostes incorrectes: " + incorrectes, 15, y);
    y += 7;

    doc.text("Frases pendents: " + pendents, 15, y);

    y += 15;

    // RESULTATS INDIVIDUALS.
    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text("RESULTATS DE CADA FRASE", 15, y);

    y += 12;

    resultats.forEach((r, index) => {

        // SALT DE PÀGINA SI CAL.
        if (y > 265) {
            doc.addPage();
            y = 20;
        }

        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);

        doc.text("FRASE " + (index + 1), 15, y);

        y += 7;

        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);

        // RESPOSTA DE L'ALUMNE/A.
        const resposta = r.resposta || "Sense resposta";
        const liniesResposta = doc.splitTextToSize(
            "Resposta de l'alumne/a: " + resposta,
            170
        );

        doc.text(liniesResposta, 20, y);
        y += liniesResposta.length * 5 + 2;

        // PARAULA CORRECTA.
        doc.text("Paraula correcta: " + r.paraula, 20, y);
        y += 6;

        // ESTAT.
        doc.text("Resultat: " + r.estat, 20, y);
        y += 10;
    });

    // DESCÀRREGA DEL DOCUMENT.
    doc.save("resultats_completem_les_frases.pdf");

});
</script>
